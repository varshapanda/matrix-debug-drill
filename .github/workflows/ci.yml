name: Matrix CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      # Run every environment even if another combination fails.
      # This is correct for a compatibility matrix because we need
      # visibility into all OS/runtime combinations.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]

        include:
          - os: ubuntu-latest
            node: 24
            experimental: true

          - os: windows-latest
            node: 24
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Print environment info for debugging
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test